name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish To Maven Central
    runs-on: ubuntu-24.04
    environment: release

    env:
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release version
        run: |
          current_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ -z "$current_version" ]; then
            echo "Failed to read project version from build.gradle.kts"
            exit 1
          fi
          if [[ "$current_version" == *-SNAPSHOT ]]; then
            echo "Release workflow does not publish SNAPSHOT versions"
            exit 1
          fi

      - name: Run checks
        run: ./gradlew check

      - name: Publish release
        run: ./gradlew publishToSonatype closeAndReleaseStagingRepositories

      - name: Resolve release metadata
        id: metadata
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "Failed to read project version from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION"
