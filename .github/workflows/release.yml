name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish To Maven Central
    runs-on: ubuntu-24.04
    environment: release

    env:
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify release version
        run: |
          current_version="$(sed -n 's/^version = \"\\(.*\\)\"$/\\1/p' build.gradle.kts)"
          if [ -z "$current_version" ]; then
            echo "Failed to read project version from build.gradle.kts"
            exit 1
          fi
          if [[ "$current_version" == *-SNAPSHOT ]]; then
            echo "Release workflow does not publish SNAPSHOT versions"
            exit 1
          fi

      - name: Run checks
        run: ./gradlew check

      - name: Publish release
        run: ./gradlew publishToSonatype closeAndReleaseStagingRepositories
